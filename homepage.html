<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leading Financial</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* Global Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
        }
        
        body {
            background-color: #f5f5f5;
            color: #333;
            line-height: 1.6;
        }
        
        /* Navbar Styles */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 5%;
            background-color: #1a1a1a;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            border-bottom: 2px solid #d4af37;
        }
        
        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            color: #d4af37;
            cursor: pointer;
            letter-spacing: 1px;
        }
        
        .navbar ul {
            display: flex;
            list-style: none;
            gap: 2rem;
            margin-right: auto;
            margin-left: 3rem;
        }
        
        .navbar ul li a {
            text-decoration: none;
            color: #b3b3b3;
            font-weight: 500;
            font-size: 1rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            letter-spacing: 0.5px;
            padding: 0.5rem 0;
            position: relative;
        }
        
        .navbar ul li a:hover {
            color: #d4af37;
        }
        
        .navbar ul li a.active {
            color: #d4af37;
            font-weight: 600;
        }
        
        .navbar ul li a.active:after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: #d4af37;
        }
        
        /* Profile Icon Styles */
        .profile-container {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }
        
        .profile-icon {
            color: #b3b3b3;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }
        
        .profile-icon:hover {
            color: #d4af37;
            transform: scale(1.1);
        }
        
        .profile-dropdown {
            position: absolute;
            right: 5%;
            top: 100%;
            background-color: #1a1a1a;
            border: 1px solid #d4af37;
            border-radius: 4px;
            padding: 1rem;
            width: 200px;
            display: none;
            z-index: 1001;
        }
        
        .profile-container:hover .profile-dropdown {
            display: block;
        }
        
        .profile-dropdown a {
            display: block;
            color: #b3b3b3;
            padding: 0.5rem 0;
            text-decoration: none;
            transition: color 0.3s;
        }
        
        .profile-dropdown a:hover {
            color: #d4af37;
        }
        
        .profile-dropdown a i {
            margin-right: 0.5rem;
            width: 20px;
            text-align: center;
        }
        
        /* Hero Section */
        .hero {
            height: 100vh;
            background: linear-gradient(rgba(26, 26, 26, 0.7), rgba(26, 26, 26, 0.7)), 
                        url('michyv.jpg') no-repeat center center/cover;
            display: flex;
            align-items: center;
            padding: 0 5%;
            color: white;
            margin-top: 80px;
            text-align: center;
        }
        
        .hero-content {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .hero-content h1 {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            line-height: 1.2;
            font-weight: 700;
            letter-spacing: 1px;
            color: #d4af37;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        .hero-content h1 span {
            color: #f5f5f5;
            font-weight: 300;
        }
        
        .hero-content p {
            font-size: 1.3rem;
            margin-bottom: 2.5rem;
            color: #b3b3b3;
            letter-spacing: 0.5px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .hero-content .btn {
            background-color: transparent;
            color: #d4af37;
            padding: 1rem 2.5rem;
            font-size: 1.1rem;
            border: 2px solid #d4af37;
            transition: all 0.4s ease;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        
        .hero-content .btn:hover {
            background-color: #d4af37;
            color: #1a1a1a;
            transform: translateY(-3px);
            box-shadow: 0 6px 16px rgba(212, 175, 55, 0.4);
        }
        
        /* Icons styling */
        .navbar ul li a i {
            color: #d4af37;
            font-size: 1.1rem;
        }
        
        /* Responsive Design */
        @media (max-width: 992px) {
            .navbar {
                flex-direction: column;
                padding: 1.2rem;
            }
            
            .navbar ul {
                margin: 1.2rem 0;
                flex-wrap: wrap;
                justify-content: center;
                gap: 1.5rem;
                margin-left: 0;
            }
            
            .profile-container {
                margin-top: 1rem;
            }
            
            .hero-content h1 {
                font-size: 3rem;
            }
        }
        
        @media (max-width: 768px) {
            .hero-content h1 {
                font-size: 2.5rem;
            }
            
            .hero-content p {
                font-size: 1.1rem;
            }
            
            .navbar ul li a {
                font-size: 0.9rem;
            }
            
            .profile-icon {
                font-size: 1.3rem;
            }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">Payminders</div>
            <ul>
                <li><a href="#" class="active"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
                <li><a href="newinv.html"><i class="fas fa-file-invoice-dollar"></i> Invoices</a></li>
                <li><a href="clients.html"><i class="fas fa-users"></i> Clients</a></li>
                <li><a href="reminders.html"><i class="fas fa-bell"></i> Reminders</a></li>
                <li><a href="reports.html"><i class="fas fa-chart-bar"></i> Reports</a></li>
                <li><a href="profile.html"><i class="fas fa-cog"></i> Settings</a></li>
                <li><a href="contact us.html"><i class="fas fa-question-circle"></i> Help</a></li>
            </ul>
            <div class="profile-container">
                <div class="profile-icon">
                    <i class="fas fa-user-circle"></i>
                    <div class="profile-dropdown">
                        <a href="profile.html"><i class="fas fa-user"></i> My Profile</a>
                    
                        <a href="#" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>
    
    <section class="hero">
        <div class="hero-content">
            <h1>LEADING <span>FINANCIAL.</span></h1>
            <p>True relationships develop the future through trust and premium service.</p>
            <button class="btn">Contact Us</button>
        </div>
    </section>

    <script>
        function logout() {
            // Optional: Add confirmation dialog
            if(confirm('Are you sure you want to logout?')) {
                // Clear any client-side storage
                localStorage.clear();
                sessionStorage.clear();
                
                // Redirect to login page
                window.location.href = "login.html";
            }
        }
    </script>
</body>
</html>
