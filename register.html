<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stylized Register Page</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="Login.js"></script>
  <style>
    /* Global Styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
    }
    
    body {
      background: linear-gradient(rgba(26, 26, 26, 0.85), rgba(26, 26, 26, 0.85)), 
                  url('michyv.jpg') no-repeat center center/cover;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    /* Container Styles */
    .container {
      display: flex;
      width: 900px;
      height: 600px;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }
    
    /* Left Section */
    .left-section {
      flex: 1;
      background-color: rgba(26, 26, 26, 0.9);
      padding: 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      backdrop-filter: blur(5px);
      border-right: 2px solid #d4af37;
      z-index: 2;
    }
    
    .left-section h1 {
      color: #d4af37;
      font-size: 2.5rem;
      margin-bottom: 40px;
      text-align: center;
      letter-spacing: 1px;
    }
    
    /* Form Styles */
    form {
      display: flex;
      flex-direction: column;
      gap: 30px;
    }
    
    .input-group {
      position: relative;
    }
    
    .input-group input {
      width: 100%;
      padding: 15px 15px 15px 45px;
      background-color: rgba(51, 51, 51, 0.8);
      border: none;
      border-radius: 5px;
      color: #f5f5f5;
      font-size: 1rem;
      outline: none;
      transition: all 0.3s ease;
    }
    
    .input-group input:focus {
      box-shadow: 0 0 0 2px #d4af37;
    }
    
    .input-group i {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: #d4af37;
    }
    
    button[type="submit"] {
      background-color: #d4af37;
      color: #1a1a1a;
      border: none;
      padding: 15px;
      border-radius: 5px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    
    button[type="submit"]:hover {
      background-color: #c9a227;
      transform: translateY(-3px);
      box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
    }
    
    /* Footer Link */
    .footer {
      margin-top: 30px;
      text-align: center;
      color: #b3b3b3;
    }
    
    .footer a {
      color: #d4af37;
      text-decoration: none;
      font-weight: 500;
      transition: all 0.3s ease;
    }
    
    .footer a:hover {
      text-decoration: underline;
    }
    
    /* Right Section */
    .right-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px;
      color: white;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    
    .right-section::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: url('sung.jpeg') no-repeat center center/cover;
      filter: brightness(1.2) contrast(0.9) saturate(1.5);
      z-index: -1;
      animation: glow 8s infinite alternate;
    }
    
    .right-section::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(
        135deg,
        rgba(212, 175, 55, 0.15) 0%,
        rgba(26, 26, 26, 0.7) 50%,
        rgba(212, 175, 55, 0.15) 100%
      );
      z-index: -1;
    }
    
    @keyframes glow {
      0% {
        filter: brightness(1.2) contrast(0.9) saturate(1.5) blur(0px);
      }
      100% {
        filter: brightness(1.4) contrast(0.8) saturate(1.8) blur(1px);
      }
    }
    
    .right-section h2 {
      color: #d4af37;
      font-size: 2.5rem;
      margin-bottom: 20px;
      letter-spacing: 1px;
      text-shadow: 0 0 10px rgba(212, 175, 55, 0.7);
    }
    
    .right-section p {
      color: #f5f5f5;
      font-size: 1.2rem;
      max-width: 300px;
      text-shadow: 0 0 8px rgba(0, 0, 0, 0.5);
    }
    
    /* Responsive Design */
    @media (max-width: 992px) {
      .container {
        width: 700px;
        height: 500px;
      }
      
      .left-section {
        padding: 40px;
      }
    }
    
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
        width: 90%;
        height: auto;
      }
      
      .left-section {
        padding: 40px 30px;
        border-right: none;
        border-bottom: 2px solid #d4af37;
      }
      
      .right-section {
        display: none;
      }
    }
    .feedback-message {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 15px 25px;
      border-radius: 5px;
      color: white;
      font-weight: 500;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      transform: translateX(200%);
      transition: transform 0.3s ease-out;
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .feedback-message.show {
      transform: translateX(0);
    }
    
    .feedback-message.success {
      background-color: #28a745;
      border-left: 5px solid #1e7e34;
    }
    
    .feedback-message.error {
      background-color: #dc3545;
      border-left: 5px solid #bd2130;
    }
    
    .feedback-message i {
      font-size: 1.2rem;
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <!-- Left section -->
    <div class="left-section">
      <h1>Register</h1>
      <form id="registerForm">
        <div class="input-group">
          <input type="text" id="username" name="username" placeholder="Username" required>
          <i class="fas fa-user"></i>
        </div>
        <div class="input-group">
          <input type="email" id="email" name="email" placeholder="Email" required>
          <i class="fas fa-envelope"></i>
        </div>
        <div class="input-group">
          <input type="password" id="password" name="password" placeholder="Password" required>
          <i class="fas fa-lock"></i>
        </div>
        <button type="submit">Register</button>
      </form>
      <div class="footer">
        Already have an account? <a href="login page .html">Login</a>
      </div>
    </div>

    <!-- Right section -->
    <div class="right-section">
      <h2>JOIN US TODAY!</h2>
      <p>Sign up and start your journey with us.</p>
    </div>
    <div id="feedbackMessage" class="feedback-message" style="display: none;">
      <i class="fas fa-check-circle"></i>
      <span id="feedbackText"></span>
    </div>
  </div>
  
</body>
</html>
